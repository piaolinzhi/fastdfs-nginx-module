# =============================================================================
# yijiao-nginx-fdfs Nginx 主配置
# 业务站点配置放在 conf.d/*.conf 中（完整的 server 块），由本文件在 http 层 include
# =============================================================================

user  nginx;
worker_processes  auto;

error_log  /usr/local/nginx/logs/error.log;
pid        /usr/local/nginx/logs/nginx.pid;

events {
    worker_connections  65535;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    #tcp_nopush     on;

    log_format web   '$remote_addr - $host [$time_local] '
                     '"$request" $status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" $http_x_forwarded_for ';

    error_log /usr/local/nginx/logs/error.log;
    access_log /usr/local/nginx/logs/access.log web;

    keepalive_timeout  65;

    #gzip  on;

    client_header_timeout 120s;
    client_body_timeout 120s;

    map $http_upgrade $connection_upgrade {
    default Upgrade;
    ''      close;
        }

    # FastDFS 模块：文件上传/下载请求体较大，放宽缓冲区与请求体大小限制
    client_body_buffer_size 128k;
    client_max_body_size 0;

    # 业务站点配置：conf.d/*.conf 内放完整的 server 块
    include /usr/local/nginx/conf/conf.d/*.conf;

    # 容器健康检查专用端口，与业务站点的 80 端口互不影响
    server {
        listen       8080;
        server_name  localhost;

        location /status {
            stub_status;
        }
    }
}
